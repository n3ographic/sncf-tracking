# Import quotidien du GTFS statique (horaires théoriques INOUI/OUIGO, J à J+2),
# puis contrôle du collecteur : un échec du job déclenche le courriel de GitHub à l'auteur.
name: import-static

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run import:static
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Contrôle du collecteur (dernier passage < 10 min, last_error vide)
        if: always()
        run: npx tsx scripts/check-collector.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
